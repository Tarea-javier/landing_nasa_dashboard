<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADAM · Astronaut Monitoring</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="barra">
  <img class="logo" src="assets/adam_logo.png" alt="ADAM — Automatically device for Astronaut Monitoring">
  <nav class="pestanas" role="tablist" aria-label="Views">
    <button role="tab" id="tab-vivo" aria-selected="true" aria-controls="vista-vivo">Live</button>
    <button role="tab" id="tab-historial" aria-selected="false" aria-controls="vista-historial">History</button>
  </nav>
  <div class="conexion" id="conexion"><i></i><span>Connecting…</span></div>
</header>

<main>
  <section id="vista-vivo" role="tabpanel" aria-labelledby="tab-vivo">
    <div class="cabina" id="cabina" aria-label="Cabin environment"></div>
    <div class="dupla" id="dupla"></div>
  </section>

  <section id="vista-historial" role="tabpanel" aria-labelledby="tab-historial" hidden>
    <div class="controles">
      <nav class="segmentado" id="h-metricas" aria-label="Metric"></nav>
      <nav class="segmentado" id="h-rangos" aria-label="Range"></nav>
    </div>
    <article class="panel grande">
      <div class="leyenda" id="h-leyenda"></div>
      <div class="lienzo"><canvas id="h-canvas"></canvas><div class="globo" id="h-globo" hidden></div></div>
    </article>
    <div class="dupla" id="h-resumen"></div>
    <article class="panel grande">
      <h2>Daily log · last 14 days</h2>
      <div class="tabla-caja"><table id="h-tabla"></table></div>
    </article>
  </section>
</main>
<aside class="adam" id="adam" aria-label="ADAM assistant"></aside>
</body>
</html>
